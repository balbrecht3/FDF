<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>FDF Matchups</title>
<meta name="theme-color" content="#16a2c4">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="FDF">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:ital,wght@0,500;0,600;0,700;1,700;1,800&family=Barlow+Condensed:ital,wght@0,600;1,700;1,800&display=swap" rel="stylesheet">
<style>
:root{
  --teal:#16a2c4; --teal2:#0f7f9c; --tealdk:#0a5f76;
  --bg:#eceef1; --card:#fff; --final:#e2e5e9; --strip:#d6dade; --strip-live:#f1f3f5;
  --ink:#18222e; --dim:#6b7684; --faint:#9aa4b0; --line:#d5d9de;
  --green:#22a447; --red:#e0463a; --gold:#f2bf2b; --outer:#0d1117;
  --top:env(safe-area-inset-top,0px); --bot:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--outer);color:var(--ink);font-family:Barlow,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
img{display:block}
.app{max-width:520px;margin:0 auto;min-height:100vh;background:var(--bg);position:relative;padding-bottom:calc(64px + var(--bot))}

/* ---------- top bar ---------- */
.top{position:sticky;top:0;z-index:40;background:var(--teal);padding:calc(8px + var(--top)) 12px 8px;display:flex;align-items:center;gap:10px;box-shadow:0 1px 0 rgba(0,0,0,.08)}
.iconbtn{width:38px;height:38px;border-radius:10px;display:grid;place-items:center;color:#fff;flex:none}
.iconbtn svg{width:24px;height:24px}
.embed .home{visibility:hidden}
.picker{flex:1;min-width:0;display:flex;justify-content:center}
.picker button{max-width:100%;background:rgba(0,0,0,.14);color:#fff;border-radius:8px;padding:8px 14px;font-weight:600;font-size:15px;display:flex;align-items:center;gap:8px;white-space:nowrap;overflow:hidden}
.picker button span{overflow:hidden;text-overflow:ellipsis}
.picker svg{width:12px;height:12px;flex:none}
.brandbtn{width:46px;height:38px;border-radius:9px;background:#fff;display:grid;place-items:center;flex:none;overflow:hidden}
.brandbtn img{width:42px;height:auto}

/* ---------- week bar ---------- */
.weekbar{display:flex;align-items:center;justify-content:center;gap:4px;padding:8px 0 0}
.weekbar button{width:34px;height:28px;border-radius:14px;color:var(--dim);display:grid;place-items:center}
.weekbar button:disabled{opacity:.3}
.weekbar .wk{font-family:"Barlow Condensed";font-weight:700;font-style:italic;letter-spacing:.8px;font-size:15px;color:var(--ink);background:#fff;border-radius:14px;padding:4px 16px;text-transform:uppercase;min-width:110px;text-align:center;box-shadow:0 1px 2px rgba(0,0,0,.06)}
.livedot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--red);margin-left:6px;vertical-align:1px;animation:pulse 1.4s infinite}
@keyframes pulse{50%{opacity:.25}}

/* ---------- scoreboard header ---------- */
.board{background:#fff;margin:8px 0 0;padding:12px 12px 10px;display:grid;grid-template-columns:1fr auto 1fr;gap:6px;box-shadow:0 1px 3px rgba(0,0,0,.06)}
.side{min-width:0}
.side .row1{display:flex;align-items:center;gap:10px}
.side.R .row1{flex-direction:row-reverse}
.av{position:relative;flex:none;cursor:pointer}
.av img,.av .ph{width:64px;height:64px;border-radius:50%;object-fit:cover;background:#dfe3e8}
.av .ph{display:grid;place-items:center;font-weight:800;font-size:22px;color:#fff;background:var(--teal2)}
.seed{position:absolute;top:-3px;left:-3px;width:22px;height:22px;border-radius:6px;background:var(--teal);color:#fff;font-size:12px;font-weight:800;display:grid;place-items:center;border:2px solid #fff}
.side.R .seed{left:auto;right:-3px}
.tot{font-family:"Barlow Condensed";font-weight:800;font-style:italic;font-size:30px;line-height:1;letter-spacing:-.3px}
.tot small{font-size:18px}
.side.R .tot,.side.R .pj{text-align:right}
.side .pj{font-size:12.5px;font-weight:700;margin-top:3px}
.pj.up{color:var(--green)} .pj.dn{color:var(--red)}
.side .tn{font-weight:700;font-size:15px;margin-top:9px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer}
.side .mg{font-size:12px;color:var(--dim);margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.side.R .tn,.side.R .mg{text-align:right}
.vs{align-self:start;margin-top:24px;font-size:11px;color:var(--faint);font-weight:600}
.minbar{height:5px;background:#e3e7eb;border-radius:3px;margin-top:9px;overflow:hidden;position:relative}
.minbar i{position:absolute;top:0;bottom:0;left:0;background:var(--teal);border-radius:3px}
.side.R .minbar i{left:auto;right:0}
.minlbl{display:flex;justify-content:space-between;font-size:10.5px;color:var(--dim);margin-top:4px}
.side.R .minlbl{flex-direction:row-reverse}

/* ---------- player cards ---------- */
.sec{font-size:12px;font-weight:700;letter-spacing:1px;color:var(--dim);padding:18px 14px 8px;text-transform:uppercase}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:6px;padding:0 6px}
.pc{background:var(--card);border-radius:7px;overflow:hidden;min-width:0;box-shadow:0 1px 2px rgba(0,0,0,.07);display:flex;flex-direction:column}
.pc.fin{background:var(--final);box-shadow:none}
.pc.empty{background:transparent;box-shadow:none;border:1.5px dashed var(--line)}
.pc-top{display:flex;align-items:flex-start;gap:6px;padding:8px 8px 0}
.pc.R .pc-top{flex-direction:row-reverse}
.hs{position:relative;flex:none;width:46px;height:46px;border-radius:50%;background:#cfd5db;overflow:hidden;box-shadow:inset 0 0 0 2px transparent}
.hs img{width:100%;height:100%;object-fit:cover}
.hs .ini{width:100%;height:100%;display:grid;place-items:center;font-weight:800;color:#fff;background:#8793a1;font-size:15px}
.hsw{flex:none;border-radius:50%;padding:2px;background:transparent}
.hsw.ring{background:var(--gold)}
.tl{width:22px;height:22px;object-fit:contain;margin-top:4px;flex:none}
.pc-sc{margin-left:auto;text-align:right;min-width:0}
.pc.R .pc-sc{margin-left:0;margin-right:auto;text-align:left}
.big{font-family:"Barlow Condensed";font-weight:800;font-style:italic;font-size:24px;line-height:1;white-space:nowrap}
.big small{font-size:15px}
.big.dash{color:var(--dim)}
.pc .pj{font-size:11.5px;color:var(--dim);margin-top:2px;font-weight:600}
.pc-nm{display:flex;align-items:baseline;gap:5px;padding:5px 9px 7px;min-width:0}
.pc.R .pc-nm{justify-content:flex-end}
.pc-nm b{font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pc-nm span{font-size:10.5px;color:var(--dim);font-weight:700;flex:none}
.inj{font-size:9.5px;line-height:14px;font-weight:800;color:#fff;background:var(--red);border-radius:3px;padding:0 4px;flex:none;align-self:center}
.badge{font-size:9px;font-weight:800;letter-spacing:.6px;color:var(--dim);background:#e8ebee;border-radius:3px;padding:2px 5px;margin-top:4px;display:inline-block}
.pc-gm{margin-top:auto;display:flex;justify-content:space-between;gap:6px;background:var(--strip);padding:4px 9px;font-size:10.5px;color:#4a5562;font-weight:600;white-space:nowrap}
.pc:not(.fin) .pc-gm{background:var(--strip-live)}
.pc.R .pc-gm{flex-direction:row-reverse}
.pc-gm span:first-child{overflow:hidden;text-overflow:ellipsis}
.pc-gm .st{flex:none}
.pc-gm .st.live{color:var(--red)}

/* ---------- team view ---------- */
.thero{background:linear-gradient(180deg,var(--teal) 0%,var(--teal2) 70%,var(--tealdk) 100%);color:#fff;padding:18px 16px 16px}
.thero .row{display:flex;align-items:center;gap:14px}
.thero .av img,.thero .av .ph{width:78px;height:78px;border:3px solid rgba(255,255,255,.85)}
.thero .seed{border-color:var(--teal2);background:#fff;color:var(--teal2)}
.thero h2{margin:0;font-size:22px;line-height:1.15;font-weight:700}
.thero .meta{font-size:13px;opacity:.9;margin-top:4px}
.thero .stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:16px}
.thero .stat{background:rgba(0,0,0,.16);border-radius:10px;padding:8px 6px;text-align:center}
.thero .stat b{display:block;font-family:"Barlow Condensed";font-style:italic;font-weight:800;font-size:20px;line-height:1.1}
.thero .stat span{font-size:10.5px;letter-spacing:.6px;text-transform:uppercase;opacity:.85}
.wkcard{background:#fff;border-radius:12px;margin:-2px 12px 0;position:relative;top:-8px;box-shadow:0 4px 14px rgba(0,0,0,.12);padding:10px 14px 12px;cursor:pointer}
.wkcard .pill{display:block;width:max-content;margin:0 auto 8px;font-family:"Barlow Condensed";font-style:italic;font-weight:700;letter-spacing:.8px;font-size:13px;color:var(--teal2);background:#e5f5fa;border-radius:10px;padding:2px 12px;text-transform:uppercase}
.wkcard .line{display:grid;grid-template-columns:auto 1fr auto 1fr auto;align-items:center;gap:8px}
.wkcard .mini img,.wkcard .mini .ph{width:38px;height:38px;border-radius:50%;object-fit:cover}
.wkcard .mini .ph{display:grid;place-items:center;background:var(--teal2);color:#fff;font-weight:800}
.wkcard .tot{font-size:24px}
.wkcard .pj{font-size:11.5px;font-weight:700}
.wkcard .c{text-align:center;color:var(--faint);font-size:11px;font-weight:600}
.wkcard .r{text-align:right}
.tlist{padding:0 8px}
.trow{display:flex;align-items:center;gap:9px;background:#fff;border-radius:8px;margin-bottom:5px;padding:7px 10px 7px 7px;box-shadow:0 1px 2px rgba(0,0,0,.06)}
.trow.fin{background:var(--final);box-shadow:none}
.slot{flex:none;width:40px;height:40px;border-radius:7px;display:grid;place-items:center;font-family:"Barlow Condensed";font-weight:700;font-size:13px;color:#fff;background:#7d8894;letter-spacing:.3px}
.slot.QB{background:#e0584e}.slot.RB{background:#1fa672}.slot.WR{background:#2f8fe0}.slot.TE{background:#ef8a2b}
.slot.FLEX{background:#8a6fd6}.slot.K{background:#5d6b7a}.slot.DL,.slot.LB,.slot.DB{background:#2f4a66}
.slot.BN{background:#b5bec8}.slot.IR{background:#c9505a}
.trow .hsw .hs{width:40px;height:40px}
.ti{flex:1;min-width:0}
.ti .n{display:flex;align-items:center;gap:5px;font-weight:700;font-size:14.5px}
.ti .n b{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:700}
.ti .s{font-size:11.5px;color:var(--dim);font-weight:600;margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ti .g{font-size:11px;color:#4a5562;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ti .g .live{color:var(--red);font-weight:700}
.tp{text-align:right;flex:none}
.tp .pj{font-size:11px;color:var(--dim);font-weight:600;margin-top:2px}
.moves{padding:0 8px}
.mv{background:#fff;border-radius:8px;padding:9px 12px;margin-bottom:5px;font-size:13px;box-shadow:0 1px 2px rgba(0,0,0,.06)}
.mv .h{font-size:10.5px;color:var(--dim);font-weight:700;letter-spacing:.5px;text-transform:uppercase;margin-bottom:3px}
.mv .add{color:var(--green);font-weight:700}.mv .drop{color:var(--red);font-weight:700}

/* ---------- scores & standings ---------- */
.scol{padding:0 8px}
.sgame{background:#fff;border-radius:10px;margin-bottom:8px;padding:8px 12px;box-shadow:0 1px 2px rgba(0,0,0,.07);cursor:pointer}
.srow{display:flex;align-items:center;gap:10px;padding:5px 0}
.srow+.srow{border-top:1px solid #eef0f2}
.srow img,.srow .ph{width:34px;height:34px;border-radius:50%;object-fit:cover;flex:none}
.srow .ph{display:grid;place-items:center;background:var(--teal2);color:#fff;font-weight:800;font-size:13px}
.srow .nm{flex:1;min-width:0}
.srow .nm b{display:block;font-size:14.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.srow .nm span{font-size:11.5px;color:var(--dim)}
.srow .sc{text-align:right}
.srow .sc .tot{font-size:23px}
.srow .sc .pj{font-size:11px;font-weight:700}
.srow.lose .tot{color:var(--dim)}
.stbl{margin:0 8px;background:#fff;border-radius:10px;overflow:hidden;box-shadow:0 1px 2px rgba(0,0,0,.07)}
.stbl table{width:100%;border-collapse:collapse;font-size:13px}
.stbl th{white-space:nowrap;font-size:10.5px;color:var(--dim);text-transform:uppercase;letter-spacing:.5px;font-weight:700;text-align:right;padding:8px 8px;background:#f5f6f8}
.stbl th:nth-child(2){text-align:left}
.stbl td{padding:8px;text-align:right;border-top:1px solid #eef0f2;white-space:nowrap}
.stbl td.rk{color:var(--dim);font-weight:700;text-align:center;width:28px}
.stbl td.tm{text-align:left;max-width:0;width:100%}
.stbl td.tm > div{display:flex;align-items:center;gap:8px;cursor:pointer}
.stbl td.tm img,.stbl td.tm .ph{width:28px;height:28px;border-radius:50%;object-fit:cover;flex:none}
.stbl td.tm .ph{display:grid;place-items:center;background:var(--teal2);color:#fff;font-weight:800;font-size:11px}
.stbl td.tm b{display:block;overflow:hidden;text-overflow:ellipsis;font-size:13.5px}
.stbl td.tm span{font-size:11px;color:var(--dim)}
.stbl tr.cut td{border-top:2px dashed var(--teal)}
.stbl .rec{font-weight:700}

/* ---------- bottom nav ---------- */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:40;display:flex;justify-content:center;pointer-events:none}
.nav .in{pointer-events:auto;width:100%;max-width:520px;background:#f7f8fa;border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(4,1fr);padding:6px 0 calc(6px + var(--bot))}
.nav button{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:10.5px;font-weight:700;letter-spacing:.6px;color:#98a2ad;text-transform:uppercase}
.nav button svg{width:26px;height:26px}
.nav button.on{color:var(--ink)}
.nav button.on svg{color:var(--teal)}

/* ---------- sheet ---------- */
.sheet{position:fixed;inset:0;z-index:60;background:rgba(10,15,22,.45);display:none;align-items:flex-start;justify-content:center;padding:calc(58px + var(--top)) 12px 12px}
.sheet.open{display:flex}
.sheet .box{width:100%;max-width:496px;background:#fff;border-radius:14px;overflow:hidden;max-height:75vh;overflow-y:auto;box-shadow:0 18px 40px rgba(0,0,0,.3)}
.sheet .opt{display:flex;align-items:center;gap:10px;width:100%;padding:11px 14px;text-align:left;border-top:1px solid #eef0f2}
.sheet .opt:first-child{border-top:0}
.sheet .opt.on{background:#e8f6fa}
.sheet .opt img,.sheet .opt .ph{width:30px;height:30px;border-radius:50%;object-fit:cover;flex:none}
.sheet .opt .ph{display:grid;place-items:center;background:var(--teal2);color:#fff;font-weight:800;font-size:12px}
.sheet .opt .t{flex:1;min-width:0;font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sheet .opt .t span{display:block;font-size:11.5px;color:var(--dim);font-weight:500}
.sheet .opt .v{font-family:"Barlow Condensed";font-style:italic;font-weight:800;font-size:16px;white-space:nowrap}

.msg{padding:40px 20px;text-align:center;color:var(--dim);font-size:14px}
.foot{text-align:center;color:var(--faint);font-size:11px;padding:16px 0 8px}
.spin{width:28px;height:28px;border:3px solid #cfd6dc;border-top-color:var(--teal);border-radius:50%;margin:0 auto 12px;animation:sp .8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<div class="app" id="app">
  <div class="top">
    <a class="iconbtn home" href="index.html" aria-label="FDF Dashboard" title="FDF Dashboard"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 3.2 2.5 11h2.7v9.3h5.3v-6h3v6h5.3V11h2.7z"/></svg></a>
    <div class="picker"><button id="pickBtn" type="button"><span id="pickTxt">Loading…</span><svg viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="2"><path d="M2 4l4 4 4-4"/></svg></button></div>
    <a class="brandbtn" href="index.html" aria-label="Favre Dolar Fantasy"><img src="logo.png" alt="FDF"></a>
  </div>
  <div id="main"><div class="msg"><div class="spin"></div>Loading league…</div></div>
</div>
<div class="nav"><div class="in" id="nav">
  <button data-v="scores" type="button"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9"><rect x="3" y="4" width="18" height="16" rx="2.5"/><path d="M3 9h18M8 13h3M8 16.5h8"/></svg>Scores</button>
  <button data-v="matchup" type="button"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2.6c3.9 0 6.2 4.2 6.2 9.4S15.9 21.4 12 21.4 5.8 17.2 5.8 12 8.1 2.6 12 2.6zm-2 6.2h4v1.3h-4zm0 2.5h4v1.3h-4zm0 2.5h4v1.3h-4zM11.3 5.4h1.4v2.2h-1.4zm0 11h1.4v2.2h-1.4z"/></svg>Matchup</button>
  <button data-v="team" type="button"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9"><path d="M5 20c0-3.6 3.1-5.6 7-5.6s7 2 7 5.6"/><circle cx="12" cy="8" r="3.8"/></svg>Team</button>
  <button data-v="standings" type="button"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9"><path d="M7 4h10v4a5 5 0 0 1-10 0zM7 6H4v1.5A3 3 0 0 0 7 10.5M17 6h3v1.5a3 3 0 0 1-3 3M12 13v4M8.5 20h7M9.5 17h5"/></svg>Standings</button>
</div></div>
<div class="sheet" id="sheet"><div class="box" id="sheetBox"></div></div>

<script>
(function(){
'use strict';
var LEAGUE = '1388683349949685760';
var SEASON = '2026';
var API = 'https://api.sleeper.app/v1';
// Sleeper owner user_id -> FDF manager short name (same mapping the 2026 HQ tab uses).
var OWNER_TO_MGR = {
  '566691851718303744':'Braiden','609548868136263680':'Kunerth','609098894785212416':'Layton',
  '1381467290075148288':'Kyle','609099740629499904':'Lamp','609090748305969152':'Alex',
  '609103974301257728':'Stone','609100548888649728':'White','1128502372914884608':'Hugh',
  '475902124832583680':'Zach','994291833402437632':'Evan','1389356448319832064':'TJ'
};
var ESPN_TO_SLEEPER = {WSH:'WAS'};
var POS_ALL = ['QB','RB','WR','TE','K','DL','LB','DB'];
var SLOT_LABEL = {FLEX:'FLEX', SUPER_FLEX:'SF', REC_FLEX:'W/T', WRRB_FLEX:'W/R', IDP_FLEX:'IDP'};
var OFFENSE = {QB:1,RB:1,WR:1,TE:1};
var IDP = {DL:1,LB:1,DB:1};
var EMBED = /[?&]embed=1/.test(location.search);
if(EMBED) document.getElementById('app').classList.add('embed');

var S = {
  league:null, rosters:[], users:{}, byRid:{}, nflWeek:1, maxWeek:17,
  week:null, mx:{}, proj:{}, games:{}, tx:{}, players:{},
  view:'matchup', mid:null, rid:null, lastUpdate:null, timer:null
};

/* ---------- small utils ---------- */
function $(id){ return document.getElementById(id); }
function esc(t){ return String(t==null?'':t).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function lsGet(k){ try{ return localStorage.getItem(k); }catch(e){ return null; } }
function lsSet(k,v){ try{ localStorage.setItem(k,v); return true; }catch(e){ return false; } }
function lsDel(k){ try{ localStorage.removeItem(k); }catch(e){} }
function getJSON(url){ return fetch(url,{cache:'no-store'}).then(function(r){ if(!r.ok) throw new Error(r.status+' '+url); return r.json(); }); }
function r2(x){ return Math.round((x||0)*100)/100; }
function fmtBig(x, dashIfNull){
  if(x==null) return dashIfNull ? '<span class="big dash">–</span>' : '0<small>.00</small>';
  var s = r2(x).toFixed(2), p = s.split('.');
  return p[0] + '<small>.' + p[1] + '</small>';
}
function f2(x){ return r2(x).toFixed(2); }
function hashStr(s){ var h=0; for(var i=0;i<s.length;i++){ h=(h*31+s.charCodeAt(i))|0; } return (h>>>0).toString(36); }
function shortName(first,last){ first=first||''; last=last||''; return (first ? first.charAt(0)+'. ' : '') + last; }

/* ---------- league & team helpers ---------- */
function team(rid){ return S.byRid[rid] || {rid:rid, name:'Team '+rid, mgr:'', avatar:null, wins:0, losses:0, ties:0, pf:0, pa:0}; }
function avatarHTML(t, cls){
  var ini = esc((t.mgr||t.name||'?').charAt(0).toUpperCase());
  if(!t.avatar) return '<div class="ph'+(cls?' '+cls:'')+'">'+ini+'</div>';
  return '<img'+(cls?' class="'+cls+'"':'')+' src="'+esc(t.avatar)+'" alt="" loading="lazy" onerror="this.outerHTML=\'<div class=&quot;ph&quot;>'+ini+'</div>\'">';
}
function recStr(t){ return t.wins+'-'+t.losses+(t.ties?'-'+t.ties:''); }
function streakStr(t){
  var s = t.streak||''; var m = /^(\d+)([WLT])$/.exec(s);
  return m ? m[2]+m[1] : '';
}
function computeSeeds(){
  var arr = S.rosters.map(function(r){ return team(r.roster_id); });
  arr.sort(function(a,b){ return (b.wins+b.ties/2)-(a.wins+a.ties/2) || b.pf-a.pf; });
  arr.forEach(function(t,i){ t.seed = i+1; });
  return arr;
}

/* ---------- scoring ---------- */
function scoreStats(stats){
  var ss = (S.league && S.league.scoring_settings) || {}, pts = 0;
  for(var k in stats){ if(ss[k] != null && typeof stats[k] === 'number') pts += stats[k]*ss[k]; }
  return pts;
}

/* ---------- data loading ---------- */
function loadBase(){
  return Promise.all([
    getJSON(API+'/league/'+LEAGUE),
    getJSON(API+'/league/'+LEAGUE+'/rosters'),
    getJSON(API+'/league/'+LEAGUE+'/users'),
    getJSON(API+'/state/nfl').catch(function(){ return null; })
  ]).then(function(res){
    var league=res[0], rosters=res[1], users=res[2], state=res[3];
    S.league = league; S.rosters = rosters;
    var pws = (league.settings && league.settings.playoff_week_start) || 15;
    S.maxWeek = Math.min(18, pws + 2);
    S.users = {}; (users||[]).forEach(function(u){ S.users[u.user_id] = u; });
    S.byRid = {};
    rosters.forEach(function(r){
      var u = S.users[r.owner_id] || {}, md = u.metadata || {}, st = r.settings || {};
      S.byRid[r.roster_id] = {
        rid:r.roster_id, owner:r.owner_id,
        name: md.team_name ? md.team_name.trim() : (u.display_name || ('Team '+r.roster_id)),
        mgr: OWNER_TO_MGR[String(r.owner_id)] || u.display_name || '',
        avatar: md.avatar ? md.avatar : (u.avatar ? 'https://sleepercdn.com/avatars/thumbs/'+u.avatar : null),
        wins:st.wins||0, losses:st.losses||0, ties:st.ties||0,
        pf:(st.fpts||0)+(st.fpts_decimal||0)/100, pa:(st.fpts_against||0)+(st.fpts_against_decimal||0)/100,
        streak:(r.metadata&&r.metadata.streak)||'', players:r.players||[], starters:r.starters||[], reserve:r.reserve||[]
      };
    });
    computeSeeds();
    var w = state && String(state.season)===SEASON ? (state.display_week||state.week||1) : 1;
    if(state && state.season_type === 'post') w = S.maxWeek;
    S.nflWeek = Math.max(1, Math.min(S.maxWeek, w));
  });
}

// Sleeper projections carry the player's name/team/opponent/injury, so they double as the
// player directory and we never need the 15MB /players/nfl dump. Trimmed + cached per week.
function loadProj(week){
  var scoreKey = hashStr(JSON.stringify(S.league.scoring_settings||{}));
  var key = 'fdfMx_proj_'+SEASON+'_w'+week+'_'+scoreKey;
  var ttl = week < S.nflWeek ? 7*864e5 : 30*6e4;
  var cached = lsGet(key);
  if(cached){ try{ var c = JSON.parse(cached); if(Date.now()-c.t < ttl){ ingestProj(week, c.p); return Promise.resolve(); } }catch(e){} }
  var url = 'https://api.sleeper.app/projections/nfl/'+SEASON+'/'+week+'?season_type=regular&'+POS_ALL.map(function(p){return 'position[]='+p;}).join('&');
  return getJSON(url).then(function(arr){
    var p = {};
    arr.forEach(function(x){
      var pl = x.player || {}, fp = (pl.fantasy_positions||[]).filter(function(q){ return POS_ALL.indexOf(q)>=0; })[0] || pl.position || '';
      p[x.player_id] = [shortName(pl.first_name, pl.last_name), fp, x.team || pl.team || '', pl.injury_status || '', r2(scoreStats(x.stats||{})), x.opponent || ''];
    });
    // keep localStorage small: only the four most recent week caches survive
    try{
      var keys = []; for(var i=0;i<localStorage.length;i++){ var k=localStorage.key(i); if(k && k.indexOf('fdfMx_proj_')===0 && k!==key) keys.push(k); }
      keys.sort(function(a,b){ return parseInt(b.split('_w')[1])-parseInt(a.split('_w')[1]); });
      keys.slice(3).forEach(lsDel);
    }catch(e){}
    lsSet(key, JSON.stringify({t:Date.now(), p:p}));
    ingestProj(week, p);
  }).catch(function(){ S.proj[week] = S.proj[week] || {}; });
}
function ingestProj(week, p){
  var m = {};
  for(var id in p){
    var a = p[id];
    m[id] = a[4];
    var cur = S.players[id];
    // the current week's copy wins for team/injury (trades, status changes)
    if(!cur || week >= (cur.w||0)) S.players[id] = {n:a[0], pos:a[1], team:a[2], inj:a[3], w:week};
  }
  S.proj[week] = m;
}
// Fall back to the dashboard's own cached player directory for anyone with no projection (e.g. on a bye).
function fillMissingPlayers(ids){
  var miss = ids.filter(function(id){ return id && id!=='0' && !S.players[id]; });
  if(!miss.length) return Promise.resolve();
  try{
    var raw = lsGet('fdfSleeperPlayers_'+SEASON);
    if(raw){
      var obj = JSON.parse(raw); var d = obj.m || {};
      miss.forEach(function(id){
        var a = d[id]; if(!a) return;
        var nm = String(a[0]||''); var sp = nm.split(' ');
        S.players[id] = {n: sp.length>1 ? sp[0].charAt(0)+'. '+sp.slice(1).join(' ') : nm, pos:a[1]||'', team:a[2]||'', inj:'', w:0};
      });
    }
  }catch(e){}
  miss = miss.filter(function(id){ return !S.players[id]; });
  if(!miss.length) return Promise.resolve();
  // try the neighbouring weeks' projections (bye weeks), quietly
  var tries = [S.week+1, S.week-1].filter(function(w){ return w>=1 && w<=18 && !S.proj[w]; });
  return Promise.all(tries.map(loadProj)).then(function(){
    var left = miss.filter(function(id){ return !S.players[id]; });
    left.forEach(function(id){ if(isNaN(+id)) S.players[id] = {n:id+' D/ST', pos:'DEF', team:id, inj:'', w:0}; });
  });
}

function loadGames(week){
  var url = 'https://site.api.espn.com/apis/site/v2/sports/football/nfl/scoreboard?dates='+SEASON+'&seasontype=2&week='+week;
  return getJSON(url).then(function(j){
    var g = {};
    (j.events||[]).forEach(function(ev){
      var c = ev.competitions && ev.competitions[0]; if(!c) return;
      var st = c.status || ev.status || {}, ty = st.type || {};
      var idToAbbr = {}, home=null, away=null;
      (c.competitors||[]).forEach(function(x){
        var ab = x.team && x.team.abbreviation; ab = ESPN_TO_SLEEPER[ab] || ab;
        idToAbbr[x.team && x.team.id] = ab;
        var o = {ab:ab, sc:+x.score||0};
        if(x.homeAway==='home') home=o; else away=o;
      });
      if(!home || !away) return;
      var poss = c.situation && c.situation.possession ? idToAbbr[c.situation.possession] : null;
      var game = {
        state: ty.state || 'pre', detail: ty.shortDetail || '', date: ev.date,
        period: st.period||0, clock: st.clock||0, home:home, away:away, poss:poss,
        half: ty.name==='STATUS_HALFTIME'
      };
      g[home.ab] = game; g[away.ab] = game;
    });
    S.games[week] = g;
  }).catch(function(){ S.games[week] = S.games[week] || {}; });
}

function loadWeek(week){
  return Promise.all([
    getJSON(API+'/league/'+LEAGUE+'/matchups/'+week).then(function(m){ S.mx[week]=m||[]; }).catch(function(){ S.mx[week]=S.mx[week]||[]; }),
    S.proj[week] ? Promise.resolve() : loadProj(week),
    loadGames(week)
  ]).then(function(){
    var ids = [];
    (S.mx[week]||[]).forEach(function(e){ ids = ids.concat(e.players||[], e.starters||[]); });
    return fillMissingPlayers(ids);
  });
}
function loadTx(){
  var w = S.week, weeks = [w, w-1].filter(function(x){ return x>=1; });
  return Promise.all(weeks.map(function(x){
    if(S.tx[x] && x < S.nflWeek) return null;
    return getJSON(API+'/league/'+LEAGUE+'/transactions/'+x).then(function(t){ S.tx[x]=t||[]; }).catch(function(){ S.tx[x]=S.tx[x]||[]; });
  }));
}

/* ---------- game / player live math ---------- */
function gameFor(team, week){ return (S.games[week]||{})[team] || null; }
function minsLeft(g){
  if(!g) return 0;
  if(g.state==='post') return 0;
  if(g.state!=='in') return 60;
  if(g.period>4) return 0;
  return Math.max(0, (4-g.period)*15 + (g.clock||0)/60);
}
function playerLine(pid, week, entry){
  var p = S.players[pid] || {n:'Player '+pid, pos:'', team:'', inj:''};
  var g = gameFor(p.team, week);
  var pts = entry && entry.players_points ? entry.players_points[pid] : undefined;
  var proj = (S.proj[week]||{})[pid];
  proj = proj == null ? 0 : proj;
  var state = g ? g.state : (p.team ? 'bye' : 'none');
  var live;
  if(state==='post' || state==='bye' || state==='none') live = pts||0;
  else if(state==='in') live = (pts||0) + proj*minsLeft(g)/60;
  else live = proj;
  return {pid:pid, p:p, g:g, pts:pts, proj:proj, live:live, state:state, mins: state==='pre'?60:(state==='in'?minsLeft(g):0)};
}
function gameText(L){
  var g = L.g, me = L.p.team;
  if(L.state==='bye') return {a:'BYE', b:''};
  if(!g) return {a:'', b:''};
  var home = g.home.ab===me, us = home?g.home:g.away, them = home?g.away:g.home;
  var sep = home ? ' vs ' : ' @ ';
  if(g.state==='pre'){
    var d = new Date(g.date);
    var s = d.toLocaleDateString([], {weekday:'short'}) + ' ' + d.toLocaleTimeString([], {hour:'numeric', minute:'2-digit'}).replace(' ','');
    return {a: me + sep + them.ab, b: s, live:false};
  }
  var res = '';
  if(g.state==='post') res = us.sc>them.sc?' (W)':(us.sc<them.sc?' (L)':' (T)');
  return {a: me+' '+us.sc+sep+them.ab+' '+them.sc+res, b: g.state==='post' ? 'Final' : (g.half?'Half':g.detail), live: g.state==='in'};
}
function sideline(L){
  var g = L.g; if(!g || g.state!=='in' || !g.poss || g.half) return false;
  if(OFFENSE[L.p.pos]) return g.poss !== L.p.team;
  if(IDP[L.p.pos]) return g.poss === L.p.team;
  return false;
}
function teamLive(entry, week){
  var tot = 0, proj = 0, mins = 0, slots = 0;
  (entry.starters||[]).forEach(function(pid, i){
    slots++;
    if(!pid || pid==='0') return;
    var L = playerLine(pid, week, entry);
    proj += L.live; mins += L.mins;
  });
  tot = entry.points || 0;
  return {tot:tot, proj:proj, mins:mins, slots:slots};
}

/* ---------- rendering pieces ---------- */
function headshot(L, ring){
  var pid = L.pid, isDef = isNaN(+pid);
  var src = isDef ? 'https://sleepercdn.com/images/team_logos/nfl/'+String(pid).toLowerCase()+'.png' : 'https://sleepercdn.com/content/nfl/players/thumb/'+pid+'.jpg';
  var ini = esc((L.p.n||'?').replace(/^.\. /,'').charAt(0));
  return '<div class="hsw'+(ring?' ring':'')+'"><div class="hs"><img src="'+src+'" alt="" loading="lazy" onerror="this.outerHTML=\'<div class=&quot;ini&quot;>'+ini+'</div>\'"></div></div>';
}
function teamLogo(ab){ return ab ? '<img class="tl" src="https://sleepercdn.com/images/team_logos/nfl/'+esc(ab.toLowerCase())+'.png" alt="'+esc(ab)+'" loading="lazy" onerror="this.style.visibility=\'hidden\'">' : '<span class="tl"></span>'; }
function injTag(p){
  var m = {Questionable:'Q', Doubtful:'D', Out:'O', IR:'IR', PUP:'PUP', Sus:'SUS', NA:'NA'};
  var t = p.inj ? (m[p.inj] || p.inj.charAt(0)) : '';
  return t ? '<span class="inj">'+esc(t)+'</span>' : '';
}

function playerCard(pid, entry, week, side){
  if(!pid || pid==='0') return '<div class="pc empty '+side+'"><div class="pc-nm" style="padding:26px 9px;justify-content:center"><span>EMPTY</span></div></div>';
  var L = playerLine(pid, week, entry);
  var fin = L.state==='post' || L.state==='bye';
  var started = L.state==='in' || L.state==='post';
  var ring = started && L.pts != null && L.pts >= L.proj && L.proj > 0;
  var gt = gameText(L);
  var score = (L.state==='pre' || (L.state==='none' && L.pts==null)) ? '<div class="big dash">–</div>' : '<div class="big">'+fmtBig(L.pts||0)+'</div>';
  var pj = '<div class="pj">'+f2(L.proj)+'</div>';
  var badge = sideline(L) ? '<div class="badge">SIDELINE</div>' : '';
  var nm = side==='L'
    ? '<b>'+esc(L.p.n)+'</b>'+injTag(L.p)+'<span>'+esc(L.p.pos)+'</span>'
    : '<span>'+esc(L.p.pos)+'</span>'+injTag(L.p)+'<b>'+esc(L.p.n)+'</b>';
  var st = '<span class="st'+(gt.live?' live':'')+'">'+esc(gt.b)+'</span>';
  return '<div class="pc '+side+(fin?' fin':'')+'">'
    + '<div class="pc-top">'+headshot(L, ring)+teamLogo(L.p.team)+'<div class="pc-sc">'+score+pj+badge+'</div></div>'
    + '<div class="pc-nm">'+nm+'</div>'
    + '<div class="pc-gm"><span>'+esc(gt.a)+'</span>'+st+'</div>'
    + '</div>';
}

function boardSide(entry, other, week, side){
  var t = team(entry.roster_id), me = teamLive(entry, week), op = other ? teamLive(other, week) : null;
  var up = !op || me.proj >= op.proj;
  var total = Math.max(1, me.slots*60), pct = Math.max(0, Math.min(100, 100*(1 - me.mins/total)));
  var lbl = '<span>Min. Remaining</span><span>'+Math.round(me.mins)+'</span>';
  return '<div class="side '+side+'">'
    + '<div class="row1"><div class="av" data-team="'+t.rid+'">'+avatarHTML(t)+'<div class="seed">'+(t.seed||'')+'</div></div>'
    + '<div><div class="tot">'+fmtBig(me.tot)+'</div><div class="pj '+(up?'up':'dn')+'">'+f2(me.proj)+'</div></div></div>'
    + '<div class="tn" data-team="'+t.rid+'">'+esc(t.name)+'</div>'
    + '<div class="mg">'+esc(t.mgr)+' | '+recStr(t)+'</div>'
    + '<div class="minbar"><i style="width:'+pct.toFixed(1)+'%"></i></div>'
    + '<div class="minlbl">'+(side==='L'?lbl:'<span>Min. Remaining</span><span>'+Math.round(me.mins)+'</span>')+'</div>'
    + '</div>';
}

function weekPairs(week){
  var by = {};
  (S.mx[week]||[]).forEach(function(e){ if(e.matchup_id==null) return; (by[e.matchup_id]=by[e.matchup_id]||[]).push(e); });
  return Object.keys(by).map(function(k){
    var g = by[k].sort(function(a,b){ return a.roster_id-b.roster_id; });
    return {mid:+k, a:g[0], b:g[1]||null};
  }).sort(function(x,y){ return x.mid-y.mid; });
}
function anyLive(week){
  var g = S.games[week]||{}; for(var k in g){ if(g[k].state==='in') return true; } return false;
}
function weekBar(){
  var live = anyLive(S.week);
  return '<div class="weekbar"><button type="button" id="wkPrev" aria-label="Previous week"'+(S.week<=1?' disabled':'')+'><svg width="14" height="14" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="2"><path d="M8 2 4 6l4 4"/></svg></button>'
    + '<div class="wk">Week '+S.week+(live?'<span class="livedot"></span>':'')+'</div>'
    + '<button type="button" id="wkNext" aria-label="Next week"'+(S.week>=S.maxWeek?' disabled':'')+'><svg width="14" height="14" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 2l4 4-4 4"/></svg></button></div>';
}
function footer(){
  var d = S.lastUpdate ? S.lastUpdate.toLocaleTimeString([], {hour:'numeric', minute:'2-digit'}) : '';
  return '<div class="foot">Live from Sleeper'+(d?' · updated '+d:'')+(anyLive(S.week)?' · refreshing every 30s':'')+'</div>';
}

/* ---------- views ---------- */
function renderMatchup(){
  var pairs = weekPairs(S.week);
  if(!pairs.length){ setPicker('No matchups'); return weekBar()+'<div class="msg">No matchups for week '+S.week+' yet.</div>'; }
  var pr = pairs.filter(function(p){ return p.mid===S.mid; })[0];
  if(!pr && S.rid) pr = pairs.filter(function(p){ return p.a.roster_id===S.rid || (p.b && p.b.roster_id===S.rid); })[0];
  pr = pr || pairs[0];
  S.mid = pr.mid;
  var a = pr.a, b = pr.b;
  if(S.rid && b && b.roster_id===S.rid){ var tmp=a; a=b; b=tmp; }
  setPicker(team(a.roster_id).name + (b ? ' vs ' + team(b.roster_id).name : ''));
  var h = weekBar();
  h += '<div class="board">'+boardSide(a,b,S.week,'L')+'<div class="vs">VS</div>'+(b?boardSide(b,a,S.week,'R'):'<div></div>')+'</div>';
  h += '<div class="sec">Starters</div><div class="grid">';
  var sa = a.starters||[], sb = b ? (b.starters||[]) : [];
  var n = Math.max(sa.length, sb.length);
  for(var i=0;i<n;i++){ h += playerCard(sa[i], a, S.week, 'L') + (b ? playerCard(sb[i], b, S.week, 'R') : '<div></div>'); }
  h += '</div>';
  var ba = bench(a), bb = b ? bench(b) : [];
  var m = Math.max(ba.length, bb.length);
  if(m){
    h += '<div class="sec">Bench</div><div class="grid">';
    for(var j=0;j<m;j++){ h += (ba[j]?playerCard(ba[j], a, S.week, 'L'):'<div></div>') + (bb[j]?playerCard(bb[j], b, S.week, 'R'):'<div></div>'); }
    h += '</div>';
  }
  return h + footer();
}
function bench(entry){
  var st = {}; (entry.starters||[]).forEach(function(p){ st[p]=1; });
  var list = (entry.players||[]).filter(function(p){ return !st[p]; });
  var order = {QB:0,RB:1,WR:2,TE:3,K:4,DL:5,LB:6,DB:7};
  return list.sort(function(x,y){
    var px = S.players[x]||{}, py = S.players[y]||{};
    return (order[px.pos]==null?9:order[px.pos]) - (order[py.pos]==null?9:order[py.pos]);
  });
}

function renderTeam(){
  var rid = S.rid || (S.rosters[0] && S.rosters[0].roster_id);
  S.rid = rid;
  var t = team(rid);
  setPicker(t.name);
  var pairs = weekPairs(S.week);
  var pr = pairs.filter(function(p){ return p.a.roster_id===rid || (p.b && p.b.roster_id===rid); })[0];
  var me = pr ? (pr.a.roster_id===rid ? pr.a : pr.b) : null;
  var op = pr ? (pr.a.roster_id===rid ? pr.b : pr.a) : null;
  var sk = streakStr(t);
  var h = '<div class="thero"><div class="row"><div class="av">'+avatarHTML(t)+'<div class="seed">'+(t.seed||'')+'</div></div>'
    + '<div style="min-width:0"><h2>'+esc(t.name)+'</h2><div class="meta">'+esc(t.mgr)+' | '+recStr(t)+(sk?' | Streak: '+sk:'')+'</div></div></div>'
    + '<div class="stats"><div class="stat"><b>'+f2(t.pf)+'</b><span>Pts For</span></div><div class="stat"><b>'+f2(t.pa)+'</b><span>Pts Against</span></div><div class="stat"><b>'+ordinal(t.seed)+'</b><span>Standing</span></div></div></div>';
  if(me){
    var ml = teamLive(me, S.week), ol = op ? teamLive(op, S.week) : null, ot = op ? team(op.roster_id) : null;
    h += '<div class="wkcard" id="wkCard"><span class="pill">‹ Week '+S.week+' ›</span><div class="line">'
      + '<div class="mini">'+avatarHTML(t)+'</div>'
      + '<div><div class="tot">'+fmtBig(ml.tot)+'</div><div class="pj '+(!ol||ml.proj>=ol.proj?'up':'dn')+'">'+f2(ml.proj)+'</div></div>'
      + '<div class="c">vs</div>'
      + '<div class="r">'+(ol?'<div class="tot">'+fmtBig(ol.tot)+'</div><div class="pj '+(ol.proj>ml.proj?'up':'dn')+'">'+f2(ol.proj)+'</div>':'')+'</div>'
      + '<div class="mini">'+(ot?avatarHTML(ot):'')+'</div>'
      + '</div></div>';
  } else {
    h += weekBar();
  }
  var slots = (S.league.roster_positions||[]).filter(function(s){ return s!=='BN'; });
  var starters = me ? (me.starters||[]) : t.starters;
  h += '<div class="sec">Starters</div><div class="tlist">';
  starters.forEach(function(pid, i){ h += teamRow(pid, SLOT_LABEL[slots[i]]||slots[i]||'', me); });
  h += '</div>';
  var st = {}; starters.forEach(function(p){ st[p]=1; });
  var res = {}; (t.reserve||[]).forEach(function(p){ res[p]=1; });
  var all = me ? (me.players||[]) : t.players;
  var bn = bench({starters:starters, players:all.filter(function(p){ return !res[p]; })});
  if(bn.length){ h += '<div class="sec">Bench</div><div class="tlist">'; bn.forEach(function(pid){ h += teamRow(pid, 'BN', me); }); h += '</div>'; }
  var ir = (t.reserve||[]);
  if(ir.length){ h += '<div class="sec">Injured Reserve</div><div class="tlist">'; ir.forEach(function(pid){ h += teamRow(pid, 'IR', me); }); h += '</div>'; }
  h += movesHTML(rid);
  return h + footer();
}
function ordinal(n){ if(!n) return '–'; var s=['th','st','nd','rd'], v=n%100; return n+(s[(v-20)%10]||s[v]||s[0]); }
function teamRow(pid, slot, entry){
  if(!pid || pid==='0') return '<div class="trow"><div class="slot '+esc(slot)+'">'+esc(slot)+'</div><div class="ti"><div class="n" style="color:var(--faint)">Empty</div></div></div>';
  var L = playerLine(pid, S.week, entry);
  var gt = gameText(L), fin = L.state==='post' || L.state==='bye';
  var started = L.state==='in' || L.state==='post';
  var ring = started && L.pts != null && L.pts >= L.proj && L.proj > 0;
  var sc = (L.state==='pre' || L.pts==null) && L.state!=='post' ? '<div class="big dash">–</div>' : '<div class="big">'+fmtBig(L.pts||0)+'</div>';
  var cls = slot==='FLEX'||slot==='SF'||slot==='W/T'||slot==='W/R'||slot==='IDP' ? 'FLEX' : slot;
  return '<div class="trow'+(fin?' fin':'')+'"><div class="slot '+esc(cls)+'">'+esc(slot)+'</div>'+headshot(L, ring)
    + '<div class="ti"><div class="n"><b>'+esc(L.p.n)+'</b>'+injTag(L.p)+'</div><div class="s">'+esc((L.p.team||'FA')+' · '+L.p.pos)+'</div>'
    + '<div class="g">'+esc(gt.a)+(gt.b?' · <span class="'+(gt.live?'live':'')+'">'+esc(gt.b)+'</span>':'')+'</div></div>'
    + '<div class="tp">'+sc+'<div class="pj">'+f2(L.proj)+'</div></div></div>';
}
function movesHTML(rid){
  var list = [];
  [S.week, S.week-1].forEach(function(w){ (S.tx[w]||[]).forEach(function(x){ if(x.status==='complete' && x.type!=='commissioner' && (x.roster_ids||[]).indexOf(rid)>=0) list.push(x); }); });
  list.sort(function(a,b){ return (b.status_updated||b.created)-(a.status_updated||a.created); });
  if(!list.length) return '';
  var nm = function(id){ return esc((S.players[id]||{n:'Player '+id}).n); };
  var h = '<div class="sec">Recent Moves</div><div class="moves">';
  list.slice(0,6).forEach(function(x){
    var when = new Date(x.status_updated||x.created).toLocaleDateString([], {month:'short', day:'numeric'});
    var type = x.type==='free_agent' ? 'Free agent' : (x.type==='waiver' ? 'Waiver' : (x.type==='trade' ? 'Trade' : x.type));
    var parts = [];
    Object.keys(x.adds||{}).forEach(function(id){ if(x.adds[id]===rid) parts.push('<span class="add">+ '+nm(id)+'</span>'); });
    Object.keys(x.drops||{}).forEach(function(id){ if(x.drops[id]===rid) parts.push('<span class="drop">– '+nm(id)+'</span>'); });
    if(x.type==='trade'){
      var others = (x.roster_ids||[]).filter(function(r){ return r!==rid; }).map(function(r){ return esc(team(r).name); });
      type += ' with ' + others.join(', ');
    }
    if(parts.length) h += '<div class="mv"><div class="h">'+esc(type)+' · '+when+'</div>'+parts.join(' &nbsp; ')+'</div>';
  });
  return h + '</div>';
}

function renderScores(){
  setPicker('Week '+S.week+' Scores');
  var pairs = weekPairs(S.week);
  var h = weekBar() + '<div class="sec">Matchups</div><div class="scol">';
  if(!pairs.length) h += '<div class="msg">No matchups for week '+S.week+' yet.</div>';
  pairs.forEach(function(p){
    var la = teamLive(p.a, S.week), lb = p.b ? teamLive(p.b, S.week) : null;
    var done = !anyPending(p.a) && (!p.b || !anyPending(p.b));
    h += '<div class="sgame" data-mid="'+p.mid+'">' + srow(p.a, la, lb, done) + (p.b ? srow(p.b, lb, la, done) : '') + '</div>';
  });
  return h + '</div>' + footer();
}
function anyPending(entry){ return teamLive(entry, S.week).mins > 0; }
function srow(e, me, op, done){
  var t = team(e.roster_id);
  var lose = done && op && me.tot < op.tot;
  return '<div class="srow'+(lose?' lose':'')+'">'+avatarHTML(t)+'<div class="nm"><b>'+esc(t.name)+'</b><span>'+esc(t.mgr)+' · '+recStr(t)+'</span></div>'
    + '<div class="sc"><div class="tot">'+fmtBig(me.tot)+'</div>'+(done?'':'<div class="pj '+(!op||me.proj>=op.proj?'up':'dn')+'">'+f2(me.proj)+'</div>')+'</div></div>';
}

function renderStandings(){
  setPicker(S.league.name || 'Standings');
  var arr = computeSeeds().slice();
  var cut = (S.league.settings && S.league.settings.playoff_teams) || 6;
  var h = '<div class="sec">Standings</div><div class="stbl"><table><thead><tr><th></th><th>Team</th><th>W-L</th><th>PF</th><th>PA</th><th>Strk</th></tr></thead><tbody>';
  arr.forEach(function(t, i){
    h += '<tr'+(i===cut?' class="cut"':'')+'><td class="rk">'+(i+1)+'</td><td class="tm"><div data-team="'+t.rid+'">'+avatarHTML(t)+'<div style="min-width:0"><b>'+esc(t.name)+'</b><span>'+esc(t.mgr)+'</span></div></div></td>'
      + '<td class="rec">'+recStr(t)+'</td><td>'+f2(t.pf)+'</td><td>'+f2(t.pa)+'</td><td>'+esc(streakStr(t)||'–')+'</td></tr>';
  });
  h += '</tbody></table></div><div class="foot">Top '+cut+' make the playoffs · dashed line = cut line</div>';
  return h;
}

/* ---------- picker sheet ---------- */
function setPicker(txt){ $('pickTxt').textContent = txt; }
function openSheet(){
  var box = $('sheetBox'), h = '';
  if(S.view==='team' || S.view==='standings'){
    computeSeeds().forEach(function(t){
      h += '<button class="opt'+(t.rid===S.rid?' on':'')+'" data-team="'+t.rid+'" type="button">'+avatarHTML(t)+'<div class="t">'+esc(t.name)+'<span>'+esc(t.mgr)+' · '+recStr(t)+'</span></div><div class="v">#'+t.seed+'</div></button>';
    });
  } else {
    weekPairs(S.week).forEach(function(p){
      var ta = team(p.a.roster_id), tb = p.b ? team(p.b.roster_id) : null;
      var la = teamLive(p.a, S.week), lb = p.b ? teamLive(p.b, S.week) : null;
      h += '<button class="opt'+(p.mid===S.mid&&S.view==='matchup'?' on':'')+'" data-mid="'+p.mid+'" type="button">'+avatarHTML(ta)+'<div class="t">'+esc(ta.name)+'<span>vs '+esc(tb?tb.name:'—')+'</span></div><div class="v">'+f2(la.tot)+' – '+(lb?f2(lb.tot):'')+'</div></button>';
    });
  }
  box.innerHTML = h || '<div class="msg">Nothing to pick yet.</div>';
  $('sheet').classList.add('open');
}
function closeSheet(){ $('sheet').classList.remove('open'); }

/* ---------- routing ---------- */
function setHash(){
  var h = '#'+S.view+'/w'+S.week+(S.view==='matchup'&&S.mid?'/m'+S.mid:'')+(S.view==='team'&&S.rid?'/t'+S.rid:'');
  if(location.hash !== h) history.replaceState(null, '', h);
  lsSet('fdfMx_last', h);
}
function readHash(h){
  var m = /^#(scores|matchup|team|standings)(?:\/w(\d+))?(?:\/m(\d+))?(?:\/t(\d+))?/.exec(h||'');
  if(!m) return false;
  S.view = m[1]; if(m[2]) S.week = +m[2]; if(m[3]) S.mid = +m[3]; if(m[4]) S.rid = +m[4];
  return true;
}
function render(){
  var html;
  if(S.view==='team') html = renderTeam();
  else if(S.view==='scores') html = renderScores();
  else if(S.view==='standings') html = renderStandings();
  else html = renderMatchup();
  $('main').innerHTML = html;
  Array.prototype.forEach.call(document.querySelectorAll('#nav button'), function(b){ b.classList.toggle('on', b.getAttribute('data-v')===S.view); });
  setHash();
}
function go(view, opts){
  opts = opts || {};
  var prevView = S.view;
  S.view = view;
  if(opts.mid != null) S.mid = opts.mid;
  if(opts.rid != null) S.rid = opts.rid;
  if(opts.week != null && opts.week !== S.week){ S.week = opts.week; render(); return refresh(); }
  if(view==='team') loadTx().then(function(){ if(S.view==='team') render(); });
  render();
  if(prevView !== view) window.scrollTo(0,0);
}

/* ---------- events ---------- */
$('pickBtn').addEventListener('click', openSheet);
$('sheet').addEventListener('click', function(e){
  var b = e.target.closest ? e.target.closest('.opt') : null;
  if(b){
    closeSheet();
    if(b.hasAttribute('data-team')) go('team', {rid:+b.getAttribute('data-team')});
    else go('matchup', {mid:+b.getAttribute('data-mid'), rid:0});
    window.scrollTo(0,0);
    return;
  }
  if(e.target === $('sheet')) closeSheet();
});
$('nav').addEventListener('click', function(e){
  var b = e.target.closest ? e.target.closest('button') : null; if(!b) return;
  go(b.getAttribute('data-v'));
});
$('main').addEventListener('click', function(e){
  var t = e.target.closest ? e.target.closest('[data-team]') : null;
  if(t){ go('team', {rid:+t.getAttribute('data-team')}); window.scrollTo(0,0); return; }
  var g = e.target.closest('.sgame');
  if(g){ go('matchup', {mid:+g.getAttribute('data-mid'), rid:0}); window.scrollTo(0,0); return; }
  if(e.target.closest('#wkPrev')){ go(S.view, {week:S.week-1}); return; }
  if(e.target.closest('#wkNext')){ go(S.view, {week:S.week+1}); return; }
  var wc = e.target.closest('#wkCard');
  if(wc){
    var r = wc.getBoundingClientRect(), x = e.clientX - r.left;
    var pill = e.target.closest('.pill');
    if(pill && x < r.width*0.5 && S.week>1){ go('team', {week:S.week-1}); return; }
    if(pill && x >= r.width*0.5 && S.week<S.maxWeek){ go('team', {week:S.week+1}); return; }
    var pairs = weekPairs(S.week), rid = S.rid;
    var pr = pairs.filter(function(p){ return p.a.roster_id===rid || (p.b && p.b.roster_id===rid); })[0];
    if(pr){ go('matchup', {mid:pr.mid}); window.scrollTo(0,0); }
  }
});
window.addEventListener('hashchange', function(){ if(readHash(location.hash)) refresh(); });

/* ---------- refresh loop ---------- */
var busy = false;
function refresh(){
  if(busy) return Promise.resolve();
  busy = true;
  var wk = S.week;
  var jobs = [loadWeek(wk)];
  if(S.view==='team') jobs.push(loadTx());
  return Promise.all(jobs).then(function(){
    S.lastUpdate = new Date();
    if(wk === S.week) render();
  }).catch(function(err){
    $('main').innerHTML = '<div class="msg">Couldn’t reach Sleeper right now.<br><small>'+esc(err.message||err)+'</small></div>';
  }).then(function(){ busy = false; schedule(); });
}
function schedule(){
  clearTimeout(S.timer);
  var ms = anyLive(S.week) ? 30000 : 300000;
  S.timer = setTimeout(function(){ if(document.visibilityState!=='hidden') refreshAll(); else schedule(); }, ms);
}
function refreshAll(){
  // records/standings move once a week; re-pull them on each slow cycle only
  var base = anyLive(S.week) ? Promise.resolve() : loadBase().catch(function(){});
  return base.then(refresh);
}
document.addEventListener('visibilitychange', function(){
  if(document.visibilityState==='visible' && S.lastUpdate && Date.now()-S.lastUpdate > 25000) refreshAll();
});

/* ---------- boot ---------- */
loadBase().then(function(){
  S.week = S.nflWeek;
  // an explicit link keeps its week; reopening the app restores the last view but always on the current week
  if(!readHash(location.hash)){ readHash(lsGet('fdfMx_last') || ''); S.week = S.nflWeek; }
  if(!S.week || S.week<1 || S.week>S.maxWeek) S.week = S.nflWeek;
  if(S.view==='matchup' && !S.mid) S.mid = 1;
  return refresh();
}).catch(function(err){
  $('main').innerHTML = '<div class="msg">Couldn’t load the league from Sleeper.<br><small>'+esc(err.message||err)+'</small><br><br><button type="button" onclick="location.reload()" style="color:var(--teal);font-weight:700">Try again</button></div>';
});

if('serviceWorker' in navigator && location.protocol==='https:' && !EMBED){
  window.addEventListener('load', function(){ navigator.serviceWorker.register('sw.js').catch(function(){}); });
}
})();
</script>
</body>
</html>
